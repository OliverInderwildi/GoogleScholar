# GitHub Action: Auto-update Google Scholar metrics on index.html
#
# Runs weekly (Mon 06:00 UTC) or manually. It executes refresh_scholar.py,
# which patches the citation numbers into the existing index.html via the
# SerpAPI Google Scholar Author API and writes scholar-data.json.
#
# This replaces the old `scholarly`-based scraper entirely. Do NOT also keep
# an inline Python step here — refresh_scholar.py is the single source of truth.
#
# REQUIRED: repository secret SERP_API_KEY (Settings -> Secrets and variables
# -> Actions -> Secrets tab). The key is read from the environment, never
# committed to the repo.

name: Update Scholar Metrics

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Scholar metrics
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: python3 refresh_scholar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scholar-data.json
          git diff --cached --quiet || git commit -m "Auto-update Scholar metrics [skip ci]"
          git push
